[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsim-orchestrator"
version = "0.1.0"
description = "CLI, game loop, validators, persistence and player interface for worldsim."
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.1",
  "anthropic>=0.40.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
worldsim = "worldsim_orchestrator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
